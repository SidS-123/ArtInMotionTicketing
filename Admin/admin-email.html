<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Email</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=K2D:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="email.css" />
  <link rel="stylesheet" href="../background.css" />
</head>
<body>
  <div class="background-overlay"></div>

  <main class="page-shell">
    <header class="top-nav">
      <a href="admin-home.html" class="nav-link">Back</a>
      <button class="nav-link" type="button">Account</button>
    </header>

    <section class="email-panel" aria-label="Send email panel">
      <form class="email-form">
        <div class="field-row">
          <label class="field-label" for="to">To:</label>
          <input id="to" name="to" type="email" required />
        </div>

        <div class="field-row">
          <label class="field-label" for="subject">Subject:</label>
          <input id="subject" name="subject" type="text" required />
        </div>

        <div class="field-row field-row-body">
          <label class="field-label" for="body">Body:</label>
          <textarea id="body" name="body" required></textarea>
        </div>

        <div class="field-row field-row-button">
          <span class="field-label field-label-spacer" aria-hidden="true"></span>
          <button class="send-email" type="submit">Send Email</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const emailForm = document.querySelector(".email-form");
    emailForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const to = document.querySelector("#to").value.trim();
      const subject = document.querySelector("#subject").value.trim();
      const body = document.querySelector("#body").value.trim();

      const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.location.href = mailto;
    });
  </script>
</body>
</html>
