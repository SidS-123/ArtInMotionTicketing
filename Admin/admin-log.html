<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Log</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=K2D:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="log.css" />
  <link rel="stylesheet" href="../background.css" />
</head>
<body>
  <div class="background-overlay"></div>

  <main class="page-shell">
    <header class="top-nav">
      <a class="nav-link" href="admin-home.html">Back</a>
      <button class="nav-link" type="button">Account</button>
    </header>

    <section class="log-panel" aria-label="Admin log">
      <h1>Log</h1>

      <div class="log-table" role="table" aria-label="Activity log entries">
        <div class="table-head" role="row">
          <span role="columnheader">Time</span>
          <span role="columnheader">User</span>
          <span role="columnheader">Action</span>
        </div>

        <div class="table-body">
          <div class="table-row" role="row">
            <span role="cell">2/10/26 @11:39 AM</span>
            <span role="cell">Prakhar</span>
            <span role="cell">Sent email to all families</span>
          </div>
          <div class="table-row" role="row">
            <span role="cell">2/9/26 @1:09 PM</span>
            <span role="cell">Sid</span>
            <span role="cell">Locked seat A1</span>
          </div>
          <div class="table-row" role="row">
            <span role="cell">2/9/26 @12:55 PM</span>
            <span role="cell">Sid</span>
            <span role="cell">Refunded $4.99 to Uppara family</span>
          </div>
          <div class="table-row" role="row">
            <span role="cell">2/8/26 @6:07 PM</span>
            <span role="cell">Uppara</span>
            <span role="cell">Bought $4.99 ticket to ____ event</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
