<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arts in Motion - Roster</title>
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="roster.css">
</head>
<body>
  <div class="background-overlay"></div>
  <div class="page-shell">
    <header class="top-nav" aria-label="Main Navigation">
      <a href="index.html" class="nav-link" aria-label="Home">
        <img src="home.png" alt="Home" class="nav-icon">
      </a>
      <a href="tickets.html" class="nav-link" aria-label="Tickets">
        <img src="ticket.png" alt="Tickets" class="nav-icon">
      </a>
      <div class="user-wrap">
        <span class="user-name">John Smith</span>
        <a href="account.html" class="nav-link" aria-label="Account">
          <img src="account.png" alt="Account" class="nav-icon">
        </a>
      </div>
      <a href="roster.html" class="nav-link" aria-label="Roster">
        <img src="recital.png" alt="Recitals" class="nav-icon">
      </a>
      <a href="cart.html" class="nav-link" aria-label="Cart">
        <img src="cart.png" alt="Cart" class="nav-icon">
      </a>
    </header>

    <main class="roster-main">
      <section class="search-wrap" aria-label="Search">
        <span class="search-icon">Q</span>
      </section>

      <section class="timings-card" aria-label="Recital timings">
        <h1>Recital Timings</h1>

        <div class="table-head">
          <span>Name</span>
          <span>Recital Name</span>
          <span>Day</span>
          <span>Time</span>
          <span class="actions-head"></span>
        </div>

        <div class="timing-row">
          <span>Jane Smith</span>
          <span>French Ballerinas</span>
          <span>Day 2</span>
          <span>6:30 PM</span>
          <a href="tickets.html" class="link-btn">Link</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
