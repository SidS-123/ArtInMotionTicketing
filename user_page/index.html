<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Arts in Motion</title>
 <link href="https://fonts.googleapis.com/css2?family=K2D:wght@400;500;600;700&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="background-overlay"></div>
 <div class="page-shell">
   <header class="top-nav" aria-label="Main Navigation">
     <a href="index.html" class="nav-link" aria-label="Home">
       <img src="home.png" alt="Home" class="nav-icon">
     </a>
     <a href="tickets.html" class="nav-link" aria-label="Tickets">
       <img src="ticket.png" alt="Tickets" class="nav-icon">
     </a>
     <div class="user-wrap">
       <span class="user-name">John Smith</span>
       <a href="account.html" class="nav-link" aria-label="Account">
         <img src="account.png" alt="Account" class="nav-icon account-icon">
       </a>
     </div>
     <a href="roster.html" class="nav-link" aria-label="Roster">
       <img src="recital.png" alt="Recitals" class="nav-icon">
     </a>
     <a href="cart.html" class="nav-link" aria-label="Cart">
       <img src="cart.png" alt="Cart" class="nav-icon">
     </a>
   </header>


   <main>
     <section class="logo-area" aria-label="Brand">
       <img src="AIM Logo.png" alt="Arts in Motion School of Dance and Movement" class="aim-logo">
     </section>


     <section class="recitals-card" aria-label="Recitals">
       <h1>Recitals</h1>


       <div class="table-head">
         <span>Name</span>
         <span>Date</span>
         <span>Time</span>
         <span class="actions-head"></span>
       </div>


       <div class="recital-row">
         <span>Spring Showcase</span>
         <span>May 18, 2026</span>
         <span>6:30 PM</span>
         <div class="ticket-cell">
           <button type="button" id="ticketInfoBtn" class="ticket-info-btn">Ticket Info</button>

           <aside id="ticketPopup" class="ticket-popup" aria-hidden="true">
             <button type="button" id="closePopupBtn" class="close-popup-btn" aria-label="Close ticket popup">x</button>
             <div class="popup-row">
               <span>Ticket Purchased</span>
               <span>Ticket Type</span>
             </div>
             <div class="popup-row popup-values">
               <span>6D, 7D, 8D</span>
               <span>Reg</span>
             </div>
           </aside>
         </div>
       </div>
     </section>
   </main>
 </div>


 <script>
   const ticketInfoBtn = document.getElementById('ticketInfoBtn');
   const ticketPopup = document.getElementById('ticketPopup');
   const closePopupBtn = document.getElementById('closePopupBtn');


   function showPopup() {
     ticketPopup.style.display = 'block';
     ticketPopup.setAttribute('aria-hidden', 'false');
   }


   function hidePopup() {
     ticketPopup.style.display = 'none';
     ticketPopup.setAttribute('aria-hidden', 'true');
   }


   ticketInfoBtn.addEventListener('click', showPopup);
   closePopupBtn.addEventListener('click', hidePopup);
 </script>
</body>
</html>
