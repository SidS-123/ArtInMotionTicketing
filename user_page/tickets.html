  <title>Arts in Motion - Tickets</title>
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tickets.css">
</head>
<body>
  <div class="background-overlay"></div>

  <div class="page-shell">
    <header class="top-nav" aria-label="Main Navigation">
      <a href="index.html" class="nav-link" aria-label="Home">
        <img src="home.png" alt="Home" class="nav-icon">
      </a>
      <a href="tickets.html" class="nav-link is-active" aria-label="Tickets" aria-current="page">
        <img src="ticket.png" alt="Tickets" class="nav-icon">
      </a>
      <div class="user-wrap">
        <span class="user-name">John Smith</span>
        <a href="account.html" class="nav-link" aria-label="Account">
          <img src="account.png" alt="Account" class="nav-icon">
        </a>
      </div>
      <a href="roster.html" class="nav-link" aria-label="Roster">
        <img src="recital.png" alt="Recitals" class="nav-icon">
      </a>
      <a href="cart.html" class="nav-link" aria-label="Cart">
        <img src="cart.png" alt="Cart" class="nav-icon">
      </a>
    </header>

    <main class="tickets-main">
      <section class="day-switch" aria-label="Day selection">
        <button type="button" class="day-btn" data-day="day1">Day 1</button>
        <button type="button" class="day-btn is-active" data-day="day2">Day 2</button>
      </section>

      <section class="content-grid">
        <article class="seating-card" aria-label="Seating chart">
          <h1>Seating Chart</h1>

          <section class="seat-chart" aria-label="Seating chart image">
            <img class="seat-chart-img" id="baseMap" src="Examples/Seating%20Chart.png" alt="Main Floor seating chart">
            
            <div class="seat-overlay" id="seatOverlay" aria-hidden="true"></div>
          </section>

          <p class="legend" aria-label="Seat legend">
            <span class="legend-item"><span class="legend-swatch legend-swatch--lux"></span>Luxury (Yellow)</span>
            <span class="legend-item"><span class="legend-swatch legend-swatch--blue"></span>Blue</span>
            <span class="legend-item"><span class="legend-swatch legend-swatch--reg"></span>Regular (Red)</span>
          </p>

          <p class="tickets-left">
            <span>Tickets left:</span>
            <span id="ticketsLeftCount" class="count-pill muted">...</span>
          </p>
        </article>

        <aside class="summary-card" aria-label="Ticket summary">
          <div class="summary-row">
            <span>Redeemable Tickets:</span>
            <span id="redeemableCount" class="count-pill">4</span>
          </div>
          <div class="summary-row">
            <span>Regular Tickets:</span>
            <span id="regularCount" class="count-pill">0</span>
          </div>
          <div class="summary-row">
            <span>Luxury Tickets:</span>
            <span id="luxuryCount" class="count-pill strong">0</span>
          </div>

          <p id="redeemableWarning" class="redeem-warning" aria-live="polite" hidden>*You have used you free redeemable tickets</p>

          <div class="total-row">
            <span>Total Amount:</span>
            <span id="totalAmount">$ 0.00</span>
          </div>

          <div class="summary-row" style="align-items: flex-start;">
            <span>Selected Seats:</span>
            <span id="selectedSeats" class="count-pill muted" style="max-width: 180px; text-align: right; white-space: normal; font-size: 12px; line-height: 1.3;">None</span>
          </div>

          <button type="button" id="addToCartBtn" class="add-btn">Save to cart</button>
        </aside>
      </section>
    </main>
  </div>

    // ---------------------------------------------------------
    // 2. STATE MANAGEMENT
    // ---------------------------------------------------------
    const state = {
      day1: { reg: new Set(), lux: new Set(), blue: new Set() },
      day2: { reg: new Set(), lux: new Set(), blue: new Set() }
    };
    let currentDay = DEFAULT_DAY;
    let totalSeats = seatMapData.length;

    // DOM Elements
    const seatOverlay = document.getElementById("seatOverlay");
    const dayButtons = document.querySelectorAll(".day-btn");
    const ticketsLeftCount = document.getElementById("ticketsLeftCount");
    const redeemableCount = document.getElementById("redeemableCount");
    const redeemableWarning = document.getElementById("redeemableWarning");
    const regularCount = document.getElementById("regularCount");
    const luxuryCount = document.getElementById("luxuryCount");
    const totalAmount = document.getElementById("totalAmount");
    const selectedSeats = document.getElementById("selectedSeats");
    const addToCartBtn = document.getElementById("addToCartBtn");

    // Formatter
    function formatMoney(amount) {
      return `$ ${amount.toFixed(2)}`;
    }

    // ---------------------------------------------------------
    // 3. CORE LOGIC
    // ---------------------------------------------------------
    function updateSummary() {
      const dayState = state[currentDay];
      const regCount = dayState.reg.size + dayState.blue.size;
      const luxCount = dayState.lux.size;
      const selectedCount = regCount + luxCount;
      
      const totalRegAcrossDays =
        state.day1.reg.size +
        state.day1.blue.size +
        state.day2.reg.size +
        state.day2.blue.size;
      const redeemableRemaining = Math.max(0, REDEEMABLE_LIMIT - totalRegAcrossDays);
      const freeUsedAcrossDays = Math.min(REDEEMABLE_LIMIT, totalRegAcrossDays);
      const chargedRegularCountAcrossDays = Math.max(0, totalRegAcrossDays - freeUsedAcrossDays);
      const totalLuxAcrossDays = state.day1.lux.size + state.day2.lux.size;
      
      const total = chargedRegularCountAcrossDays * REG_PRICE + totalLuxAcrossDays * LUX_PRICE;
      const hasUsedAllRedeemable = redeemableRemaining === 0;

      redeemableCount.textContent = String(redeemableRemaining);
      redeemableWarning.hidden = !hasUsedAllRedeemable;
      regularCount.textContent = String(regCount);
      luxuryCount.textContent = String(luxCount);
      ticketsLeftCount.textContent = String(Math.max(0, totalSeats - selectedCount));
      totalAmount.textContent = formatMoney(total);
      selectedSeats.textContent = getSelectedSeatLabels(currentDay).join(", ") || "None";
    }

    function getSelectedSeatLabels(dayKey) {
      return [...state[dayKey].reg, ...state[dayKey].blue, ...state[dayKey].lux].map(formatSeatLabelForDisplay);
    }

    function formatSeatLabelForDisplay(seatId) {
      const normalizedSeatId = String(seatId);
      return normalizedSeatId.replace(/^Ctr/i, "");
    }

    function getSeatType(seat) {
      if (String(seat.id || "").toUpperCase().startsWith("BLUE")) {
        return "blue";
      }

      return seat.type;
    }

    function buildCartTicketPayload() {
      const day1Reg = state.day1.reg.size + state.day1.blue.size;
      const day2Reg = state.day2.reg.size + state.day2.blue.size;
      const totalRegAcrossDays = day1Reg + day2Reg;
      const totalLuxAcrossDays = state.day1.lux.size + state.day2.lux.size;
      const freeTickets = Math.min(REDEEMABLE_LIMIT, totalRegAcrossDays);
      const regularTickets = Math.max(0, totalRegAcrossDays - freeTickets);
      const regularAmount = regularTickets * REG_PRICE;
      const luxuryAmount = totalLuxAcrossDays * LUX_PRICE;

      return {
        selections: {
          day1: {
            reg: [...state.day1.reg],
            blue: [...state.day1.blue],
            lux: [...state.day1.lux]
          },
          day2: {
            reg: [...state.day2.reg],
            blue: [...state.day2.blue],
            lux: [...state.day2.lux]
          }
        },
        displaySeats: {
          day1: getSelectedSeatLabels("day1"),
          day2: getSelectedSeatLabels("day2")
        },
        totals: {
          freeTickets,
          regularTickets,
          luxuryTickets: totalLuxAcrossDays,
          regularAmount,
          luxuryAmount,
          ticketSubtotal: regularAmount + luxuryAmount
        }
      };
    }

    function restoreSelectionsFromCart() {
      const raw = localStorage.getItem(CART_TICKET_KEY);
      if (!raw) {
        return;
      }

      try {
        const parsed = JSON.parse(raw);
        const selections = parsed?.selections;
        if (!selections) {
          return;
        }

        state.day1.reg = new Set(selections.day1?.reg || []);
        state.day1.blue = new Set(selections.day1?.blue || []);
        state.day1.lux = new Set(selections.day1?.lux || []);
        state.day2.reg = new Set(selections.day2?.reg || []);
        state.day2.blue = new Set(selections.day2?.blue || []);
        state.day2.lux = new Set(selections.day2?.lux || []);
      } catch (error) {
        console.warn("Could not restore saved ticket selections.", error);
      }
    }

    function paintSeatSelection() {
      document.querySelectorAll(".seat").forEach((seat) => {
        const ticketType = seat.dataset.ticketType;
        const seatId = seat.dataset.seatId;
        const isSelected = state[currentDay][ticketType].has(seatId);
        seat.classList.toggle("seat--chosen", isSelected);
        seat.setAttribute("aria-pressed", String(isSelected));
      });
    }

    function setActiveDay(nextDay) {
      currentDay = nextDay;
      dayButtons.forEach((button) => {
        const isActive = button.dataset.day === nextDay;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
      paintSeatSelection();
      updateSummary();
    }

    // ---------------------------------------------------------
    // 4. RENDER ENGINE (Generates the buttons onto the map)
    // ---------------------------------------------------------
    function renderSeats() {
      seatOverlay.innerHTML = ""; 

      seatMapData.forEach(seatData => {
        const ticketType = getSeatType(seatData);
        const seatBtn = document.createElement("button");
        seatBtn.type = "button";
        seatBtn.className = `seat seat--${ticketType}`;
        
        // Exact positioning
        seatBtn.style.left = `${seatData.x}%`;
        seatBtn.style.top = `${seatData.y}%`;
        
        // Data binding
        seatBtn.dataset.ticketType = ticketType;
        seatBtn.dataset.seatId = seatData.id;
        seatBtn.setAttribute("aria-label", `${ticketType.toUpperCase()} seat ${seatData.id}`);
        seatBtn.title = seatData.id;
        
        seatBtn.addEventListener("click", () => {
          const dayState = state[currentDay][ticketType];
          if (dayState.has(seatData.id)) {
            dayState.delete(seatData.id);
          } else {
            dayState.add(seatData.id);
          }
          paintSeatSelection();
          updateSummary();
        });

        seatOverlay.appendChild(seatBtn);
      });
    }

    // ---------------------------------------------------------
    // 5. EVENT LISTENERS
    // ---------------------------------------------------------
    dayButtons.forEach((button) => {
      button.addEventListener("click", () => {
        setActiveDay(button.dataset.day);
      });
    });

    addToCartBtn.addEventListener("click", () => {
      const selectedCount =
        state.day1.reg.size +
        state.day1.blue.size +
        state.day1.lux.size +
        state.day2.reg.size +
        state.day2.blue.size +
        state.day2.lux.size;

      if (selectedCount === 0) {
        alert("Select at least one seat before adding tickets to the cart.");
        return;
      }

      localStorage.setItem(CART_TICKET_KEY, JSON.stringify(buildCartTicketPayload()));
      window.location.href = "cart.html";
    });

    async function loadSeatMap() {
      try {
        const response = await fetch("./final-seatmap.json");
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const jsonSeatMap = await response.json();
        if (Array.isArray(jsonSeatMap) && jsonSeatMap.length > 0) {
          seatMapData = jsonSeatMap.map((seat) => ({
            ...seat,
            type: getSeatType(seat)
          }));
          totalSeats = seatMapData.length;
        }
      } catch (error) {
        console.warn("Using embedded seat map data because final-seatmap.json could not be loaded.", error);
      }

      restoreSelectionsFromCart();
      renderSeats();
      setActiveDay(DEFAULT_DAY);
    }

    // Initialize the page
    loadSeatMap();
