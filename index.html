<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arts in Motion - Main Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=K2D:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="top-nav">
        <div class="left-icons">
            <button class="icon-btn">🏠</button>
            <button class="icon-btn">📋</button>
        </div>
        
        <div class="user-info">
            <span class="user-name">John Smith</span>
            <button class="icon-btn">👤</button>
        </div>
        
        <div class="right-icon">
             <button class="icon-btn">🛒</button>
        </div>
    </header>

    <main class="main-content">
        <div class="logo-container">
            <img src="AIM Logo.webp" alt="Arts in Motion Logo" class="main-logo">
            </div>

        <section class="recitals-container">
            <h2>Recitals</h2>
            
            <div class="recitals-grid-header">
                <span>Name</span>
                <span>Date</span>
                <span>Time</span>
            </div>

            <div class="ticket-btn-container">
                 <button class="ticket-info-btn">Ticket Info</button>
            </div>
           
            </section>
    </main>

</body>
</html>
