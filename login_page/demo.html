<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Complete</title>
    <link rel="stylesheet" href="../background.css">
    <style>
        body {
            font-family: 'K2D', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }
        .demo-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 32px 40px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 420px;
            width: calc(100% - 32px);
        }
        .demo-card h1 {
            font-size: 28px;
            margin: 0 0 12px;
        }
        .demo-card p {
            margin: 0;
            font-size: 16px;
        }
        .demo-card a {
            color: #0f766e;
            text-decoration: none;
            font-weight: 600;
        }
        .demo-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="demo-card">
        <h1>Login complete</h1>
        <p><a href="#">Next page here</a></p>
    </div>
</body>
</html>
