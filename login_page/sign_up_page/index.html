<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Portal | Sign Up</title>
    <link rel="stylesheet" href="../../background.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=K2D:wght@400;600&display=swap">
</head>
<body>
    <div class="background-overlay"></div>

    <div class="signup-container">
        <div class="signup-card">
            <form id="signupForm" class="signup-form">
                <h2>Create Account</h2>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter Email" required>
                </div>

                <div class="input-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="Enter First Name" required>
                </div>

                <div class="input-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Enter Last Name" required>
                </div>

                <div class="input-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter New Password" minlength="6" required>
                </div>

                <div class="input-group">
                    <label for="family">Family</label>
                    <select id="family" name="family" required>
                        <option value="" selected disabled>Select Family</option>
                    </select>
                </div>

                <button type="submit" class="signup-btn">Sign Up</button>
                <p id="formMessage" class="form-message" aria-live="polite"></p>
                <p class="back-link"><a href="../index.html">Back to Login</a></p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.config.js"></script>
    <script src="script.js"></script>
</body>
</html>
